# yaml-language-server: $schema=https://json.schemastore.org/github-workflow
# Workaround: https://github.com/redhat-developer/vscode-yaml/issues/397

name: Minify and Build main repository
on: push

jobs:
  build:
    name: Dispatch to `sound-buttons`
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: json-syntax-check
        uses: limitusus/json-syntax-check@v2
        with:
          pattern: "\\.json$"

      - uses: zofrex/mirror-branch@v1
        if: ${{ success() }}
        with:
          target-branch: minify

      # Minify all JSON files in place using jq (pre-installed on GitHub runners).
      # Replaces the abandoned @josee9988/minifyall CLI, which crashed on install.
      - name: Minify JSON files
        run: |
          find . -name '*.json' -not -path './.git/*' -print0 | while IFS= read -r -d '' file; do
            tmp="$(mktemp)"
            jq -c . "$file" > "$tmp" && mv "$tmp" "$file"
            echo "Minified: $file"
          done

      - name: Git Auto Commit
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: minify
          commit_message: "GitHub Action: Auto Minified HTML CSS JSON JSONC"
          commit_user_name: Minify Action Bot # defaults to "GitHub Actions"
          commit_author: Minify Action Bot <actions@github.com> # defaults to author of the commit that triggered the run

      - name: Emit repository_dispatch
        if: ${{ success() }}
        uses: mvasigh/dispatch-action@main
        with:
          # You should create a personal access token and store it in your repository
          token: ${{ secrets.ACCESS_TOKEN }}
          repo: sound-buttons
          event_type: update_config
